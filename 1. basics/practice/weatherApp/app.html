<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="app.css">
</head>

<body>

    <div class="weather-app">

        <h1> Weather App</h1>

        <form id="weatherForm">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city..."
            >

            <button type="submit">
                Search
            </button>

        </form>

        <p id="message"></p>

        <div id="weather">

            <h2 id="city"></h2>

            <div id="temperature"></div>

            <p id="condition"></p>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
