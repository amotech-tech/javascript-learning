<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Racing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🏁 CAR RACING</h1>

    <div class="game">

        <!-- Road -->
        <div class="road">

            <!-- Lane lines -->
            <div class="lane lane1"></div>
            <div class="lane lane2"></div>

            <!-- Player car -->
            <div id="player" class="car player-car">
                <div class="window front-window"></div>
                <div class="window back-window"></div>

                <div class="headlight left-light"></div>
                <div class="headlight right-light"></div>

                <div class="wheel wheel1"></div>
                <div class="wheel wheel2"></div>
                <div class="wheel wheel3"></div>
                <div class="wheel wheel4"></div>
            </div>

            <!-- Enemy car -->
            <div id="enemy" class="car enemy-car">
                <div class="window front-window"></div>
                <div class="window back-window"></div>

                <div class="headlight left-light"></div>
                <div class="headlight right-light"></div>

                <div class="wheel wheel1"></div>
                <div class="wheel wheel2"></div>
                <div class="wheel wheel3"></div>
                <div class="wheel wheel4"></div>
            </div>

        </div>

    </div>

    <div class="info">
        <h2>Score: <span id="score">0</span></h2>
        <h3>Speed: <span id="speed">5</span></h3>
        <p>⬅️ Use LEFT and RIGHT arrows ➡️</p>
    </div>

    <button onclick="restartGame()">RESTART</button>

    <script src="inde.js"></script>

</body>
</html>
